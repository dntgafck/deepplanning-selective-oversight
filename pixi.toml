[workspace]
authors = ["Anton Ustinov <ustinov.ant@gmail.com>"]
channels = ["conda-forge"]
name = "selective-oversight"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
lint-all = "pre-commit run --all-files"
test = "pytest"
deepplanning-experiment = "python scripts/run_experiment.py"
model-chat = "python scripts/run_model_completion.py"
langfuse-session-usage = "python scripts/fetch_langfuse_session_usage.py"
langfuse-results-usage = "python scripts/export_langfuse_results_usage.py"

[dependencies]
# Core runtime
python = "3.11.*"
pip = "*"

importlib-metadata = "<8.7.0"

# Numerical / plotting
numpy = ">=1.26,<3"
scipy = ">=1.13,<2"
matplotlib = ">=3.9,<4"
scikit-learn = ">=1.5,<2"
pandas = ">=2.2,<3"
ipykernel = ">=7.2.0,<8"
jupyterlab = ">=4.5.6,<5"

[pypi-dependencies]
# Core libraries
httpx = ">=0.27,<1"
tenacity = ">=8.3,<10"
huggingface-hub = ">=0.30,<1"
openai = ">2"
rank-bm25 = ">=0.2.2,<0.3"

# CLI / config / workflow
hydra-core = ">=1.3.2,<2"
dvc = { version = ">=3.65.0,<4", extras = ["s3"] }
pytest = ">=8.2,<9"
pre-commit = "*"
langfuse = ">=4.0.6, <5"
seaborn = ">=0.13.2, <0.14"
fire = ">=0.7.1, <0.8"
ipywidgets = ">=8.1.8, <9"